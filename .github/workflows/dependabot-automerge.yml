name: Dependabot auto-merge

# Dependabot opens its own PRs, so the create-pull-request auto-merge step in
# the other updaters never runs for them. This flips on auto-merge for every
# Dependabot PR; branch protection still holds the gate — nothing lands red.

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash --auto "$PR_URL"
