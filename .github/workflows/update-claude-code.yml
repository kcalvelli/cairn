name: Update claude-code

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC (claude-code releases frequently)
  workflow_dispatch:
    inputs:
      version:
        description: 'Specific version to pin (default: latest stable)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update-claude-code:
    name: Update claude-code manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Update manifest
        id: update
        run: |
          VERSION="$(./scripts/update-claude-code.sh ${{ inputs.version }})"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if git diff --quiet pkgs/claude-code-manifest.json; then
            echo "claude-code already at $VERSION"
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "claude-code updated to $VERSION"
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify build
        if: steps.update.outputs.updated == 'true'
        run: |
          # Build the overlay's claude-code so a bad/yanked release or a wrong
          # upstream checksum fails CI instead of producing a broken PR.
          nix build --no-link --print-out-paths --impure --expr '
            let
              flake = builtins.getFlake (toString ./.);
              pkgs = import flake.inputs.nixpkgs {
                system = "x86_64-linux";
                config.allowUnfree = true;
                overlays = [ flake.overlays.default ];
              };
            in pkgs.claude-code'

      - name: Create Pull Request
        if: steps.update.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "ai: bump claude-code to ${{ steps.update.outputs.version }}"
          title: "ai: bump claude-code to ${{ steps.update.outputs.version }}"
          body: |
            Automated claude-code bump to **${{ steps.update.outputs.version }}**.

            Updates the vendored release manifest (`pkgs/claude-code-manifest.json`)
            that the cairn overlay pins claude-code to, ahead of nixpkgs.

            ## ✅ CI Validation
            - ✅ `nix build` of the overlay's `claude-code` succeeded (checksums
              match a downloadable release; binary patches + version-check passed).

            ## Notes
            - Generated by `./scripts/update-claude-code.sh`.
            - Review the manifest diff (version + per-platform checksums).
            - Merge to roll the new version out to downstream systems on rebuild.
          branch: update-claude-code
          delete-branch: true
          labels: |
            dependencies
            automated
