name: Update flake.lock

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 6 AM UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-flake-lock:
    name: Update flake.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - uses: DeterminateSystems/nix-installer-action@main
      
      - uses: DeterminateSystems/magic-nix-cache-action@main
      
      - name: Update flake.lock
        id: update
        run: |
          nix flake update
          
          # Check if anything changed
          if git diff --quiet flake.lock; then
            echo "No changes to flake.lock"
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            echo "flake.lock was updated"
            echo "updated=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Validate flake after update
        if: steps.update.outputs.updated == 'true'
        run: |
          echo "🔍 Validating flake structure..."
          nix flake check --all-systems --no-update-lock-file
          
          echo "✅ Flake check passed"
          echo ""
          echo "⚠️  NOTE: Flake check only validates structure, not actual builds."
          echo "Manual testing with ./scripts/test-build.sh is REQUIRED."
      
      - name: Show flake metadata
        if: steps.update.outputs.updated == 'true'
        run: |
          echo "📊 Flake metadata:"
          nix flake metadata
      
      - name: Create Pull Request
        id: cpr
        if: steps.update.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update flake.lock"
          title: "chore: update flake.lock"
          body: |
            Automated flake.lock update — cairn's own dev lock, not the fleet's.

            ## What CI gates
            - ✅ `nix flake check --all-systems` (structure)
            - ✅ Example config toplevel build (dry-run)
            - ✅ Formatting

            Branch protection blocks merge until those pass, and this PR is set
            to **auto-merge** on green. Cairn is a library: this lock only feeds
            cairn's CI, examples, and devshells — it does not touch what edge /
            mini / pangolin run. Those pin cairn downstream in nixos_config and
            get updated there.

            ## What Changed
            Review the flake.lock diff to see which inputs moved — watch nixpkgs
            major bumps and critical packages (niri, home-manager). If green,
            it merges itself. If CI goes red, it sits here until a human sorts it.
          branch: update_flake_lock_action
          delete-branch: true
          labels: |
            dependencies
            automated

      - name: Enable auto-merge
        if: steps.update.outputs.updated == 'true' && steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash --auto "${{ steps.cpr.outputs.pull-request-number }}"
