name: Update claude-desktop

on:
  schedule:
    - cron: '0 7 * * *'  # Daily at 7 AM UTC (an hour after claude-code)
  workflow_dispatch:
    inputs:
      version:
        description: 'Specific version to pin (default: latest stable)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update-claude-desktop:
    name: Update claude-desktop manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Update manifest
        id: update
        run: |
          VERSION="$(./scripts/update-claude-desktop.sh ${{ inputs.version }})"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if git diff --quiet pkgs/claude-desktop-manifest.json; then
            echo "claude-desktop already at $VERSION"
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "claude-desktop updated to $VERSION"
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify build
        if: steps.update.outputs.updated == 'true'
        run: |
          # Build the overlay's claude-desktop so a wrong hash or a broken
          # native closure (autoPatchelf failure) fails CI instead of shipping
          # a busted PR.
          nix build --no-link --print-out-paths --impure --expr '
            let
              flake = builtins.getFlake (toString ./.);
              pkgs = import flake.inputs.nixpkgs {
                system = "x86_64-linux";
                config.allowUnfree = true;
                overlays = [ flake.overlays.default ];
              };
            in pkgs.claude-desktop'

      - name: Create Pull Request
        if: steps.update.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "ai: bump claude-desktop to ${{ steps.update.outputs.version }}"
          title: "ai: bump claude-desktop to ${{ steps.update.outputs.version }}"
          body: |
            Automated claude-desktop bump to **${{ steps.update.outputs.version }}**.

            Updates the vendored manifest (`pkgs/claude-desktop-manifest.json`)
            that the cairn overlay builds Claude Desktop from, fetching
            Anthropic's official native Linux .deb from downloads.claude.ai.

            ## ✅ CI Validation
            - ✅ `nix build` of the overlay's `claude-desktop` succeeded (hash
              matches the published release; autoPatchelf closure resolved).

            ## Notes
            - Generated by `./scripts/update-claude-desktop.sh` from the apt
              repository's `Packages` index (hash converted from the published
              SHA256, no blind re-download).
            - Merge to roll the new version out to downstream systems on rebuild.
          branch: update-claude-desktop
          delete-branch: true
          labels: |
            dependencies
            automated
