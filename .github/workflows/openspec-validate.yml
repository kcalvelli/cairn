name: OpenSpec Validate

# The hand-written specs drift out of the requirement/scenario schema over
# time (requirements parked in the wrong section, stray ## ADDED headings,
# specs with no requirements at all). This catches that on the PR instead of
# months later. Runs on every PR — unfiltered — so it can be a required check
# without a path filter silently blocking unrelated PRs.

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  validate-specs:
    name: Validate OpenSpec specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      # Use cairn's OWN pinned openspec (.#openspec), not `nixpkgs#openspec`.
      # The latter floated to the runner's registry and validated with a newer,
      # stricter openspec than cairn ships — so specs passed locally and failed
      # here. This pins CI to the same version your machines get; it moves when
      # flake.lock moves.
      - name: Validate all specs
        run: |
          echo "📐 Validating OpenSpec specs..."
          nix run .#openspec -- validate --specs --no-interactive
